                        : pct >= 80
                          ? "var(--ok)"
                          : "var(--warn)";
                    div.innerHTML = `
                        <div class="att-pct-ring">
                            <svg viewBox="0 0 32 32" width="30" height="30">
                                <circle class="ring-bg" cx="16" cy="16" r="14"/>
                                <circle class="ring-fill" cx="16" cy="16" r="14" stroke="${strokeColor}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
                            </svg>
                            <div class="att-pct-text" style="color:${strokeColor}">${pct}%</div>
                        </div>
                        <div class="att-info">
                            <div class="att-top">
                                <div class="att-title">${a.Title}</div>
                                <div class="att-count">${a.effAttended}/${a.effConducted}</div>
                            </div>
                            <div class="att-margin ${a.isLow ? "low" : "ok"}">${a.marginText}</div>
                        </div>
                    `;
                    list.appendChild(div);
                };
                theory.forEach(renderItem);
                if (practical.length > 0) {
                    if (theory.length > 0) {
                        const sep = document.createElement("div");
                        sep.className = "att-sep";
                        sep.textContent = "Labs";
                        list.appendChild(sep);
                    }
                    practical.forEach(renderItem);
                }
            }

            function updateODButtons() {
                const odEl = document.getElementById("od-btn"),
                    bnEl = document.getElementById("bunk-btn");
                if (odEl && bnEl) {
                    if (calMode === "od" || odDays.length > 0)
                        odEl.classList.add("active-od");
                    else odEl.classList.remove("active-od");
                    if (calMode === "bunk" || bunkDays.length > 0)
                        bnEl.classList.add("active-bunk");
                    else bnEl.classList.remove("active-bunk");
                }
                const resetEl = document.getElementById("reset-btn");
                if (resetEl) {
                    if (
                        calMode === "od" ||
                        odDays.length > 0 ||
                        calMode === "bunk" ||
                        bunkDays.length > 0
                    )
                        resetEl.classList.add("has-active");
                    else resetEl.classList.remove("has-active");
                }
            }
            function activateOD() {
                calMode = "od";
                calSelected = new Set(odDays);
                updateODButtons();
                goTo(3);
                renderCalendar();
                renderCalConfirm();
                updateCalModeLabel();
            }
            function activateBunk() {
                calMode = "bunk";
                calSelected = new Set(bunkDays);
                updateODButtons();
                goTo(3);
                renderCalendar();
                renderCalConfirm();
                updateCalModeLabel();
            }
            function resetModifiers() {
                odDays = [];
                bunkDays = [];
                calMode = null;
                calSelected.clear();
                localStorage.removeItem("od_days");
                localStorage.removeItem("bunk_days");
                updateODButtons();
                renderAttendance();
                renderCalendar();
                renderCalConfirm();
                updateCalModeLabel();
            }
            function applyCalSelection() {
                if (calMode === "od") {
                    odDays = [...calSelected];
                    localStorage.setItem("od_days", JSON.stringify(odDays));
                } else if (calMode === "bunk") {
                    bunkDays = [...calSelected];
                    localStorage.setItem("bunk_days", JSON.stringify(bunkDays));
                }
                calMode = null;
                calSelected.clear();
                renderCalendar();
                renderCalConfirm();
                updateCalModeLabel();
                renderAttendance();
                goTo(1);
                showToast("Applied");
            }
            function cancelCalSelection() {
                calMode = null;
                calSelected.clear();
                updateODButtons();
                renderCalConfirm();
                updateCalModeLabel();
                goTo(1);
            }
            function renderCalConfirm() {
                document.getElementById("cal-confirm").style.display = calMode
                    ? "flex"
                    : "none";
            }
            function updateCalModeLabel() {
                const lbl = document.getElementById("cal-mode-label");
                if (calMode === "od")
                    lbl.innerHTML = "Select your <span>OD days</span>";
                else if (calMode === "bunk")
                    lbl.innerHTML =
                        'Select days to <span style="color:var(--danger)">bunk</span><div style="font-size:0.55rem;opacity:0.55;margin-top:2px;font-family:var(--font-mono)">Assumes attendance till selection.</div>';
                else lbl.innerHTML = "Tap a working day to view timetable";
            }

            function numVal(v) {
                if (v === null || v === undefined) return null;
                if (typeof v === "number") return v;
                if (typeof v === "object" && v.parsedValue !== undefined)
                    return v.parsedValue;
                const n = parseFloat(v);
                return isNaN(n) ? null : n;
            }
            function buildCourseTitleMap() {
                if (
                    !appData ||
                    !appData.Attendance ||
                    !Array.isArray(appData.Attendance)
                )
                    return {};
                const map = {};
                appData.Attendance.forEach((a) => {
                    if (a.Code) map[a.Code.toUpperCase()] = a.Title;
                    if (a.Code && a.Code.length > 4)
                        map[a.Code.slice(0, -1).toUpperCase()] = a.Title;
                });
                return map;
            }

            function renderMarks() {
                if (!appData || !appData.Marks || !Array.isArray(appData.Marks))
                    return;
                const list = document.getElementById("marks-list");
                list.innerHTML = "";
                if (appData.syncFailed) {
                    const bn = document.createElement("div");
                    bn.className = "stale-banner";
                    bn.innerHTML = `<div class="stale-text">Session Expired \u2014 Data Outdated</div><button class="stale-relogin" onclick="localStorage.removeItem('academia_token');location.reload();">RE-LOGIN</button>`;
                    list.appendChild(bn);
                }
                const attMap = buildCourseTitleMap();
                appData.Marks.forEach((m, idx) => {
                    let displayTitle = m.Title;
                    if (appData.Attendance) {
                        const upper = m.Title.toUpperCase();
                        if (attMap[upper]) {
                            displayTitle = attMap[upper];
                        } else {
                            const base = upper.replace(/[TPLJ]$/, "");
                            const match = Object.entries(attMap).find(
                                ([k]) =>
                                    k === base ||
                                    k.startsWith(base) ||
                                    base.startsWith(k),
                            );
                            if (match) displayTitle = match[1];
                        }
                    }
                    const valid = m.Components.filter(
                        (c) =>
                            numVal(c.scored) !== null && numVal(c.max) !== null,
                    );
                    const totalScored = valid.reduce(
                        (s, c) => s + numVal(c.scored),
                        0,
                    );
                    const totalMax = valid.reduce(
                        (s, c) => s + numVal(c.max),
                        0,
                    );
                    const div = document.createElement("div");
                    div.className = "marks-item";
                    div.style.setProperty("--i", idx + 1);
                    const formatM = (v) => {
                        const n = numVal(v);
                        if (n === null) return "0";
                        return Number.isInteger(n)
                            ? n.toString()
                            : n.toFixed(2);
                    };
                    const chips = valid
                        .slice()
                        .reverse()
                        .map((c) => {
                            const sc = numVal(c.scored),
                                mx = numVal(c.max),
                                isLow = mx > 0 && sc / mx < 0.5;
                            return `<div class="comp-chip${isLow ? " low" : ""}">${c.name}: ${formatM(c.scored)}/${formatM(c.max)}</div>`;
                        })
                        .join("");
                    div.innerHTML = `
                        <div class="marks-header">
                            <div class="marks-course">${displayTitle}</div>
                            ${totalMax > 0 ? `<div class="marks-total">${totalScored}/${totalMax}</div>` : ""}
                        </div>
                        <div class="marks-components">${chips || '<span class="empty-state" style="padding:0">No marks yet</span>'}</div>
                    `;
                    list.appendChild(div);
                });
            }

            const MONTHS = [
                "January",
                "February",
                "March",
                "April",
                "May",
                "June",
                "July",
                "August",
                "September",
                "October",
                "November",
                "December",
            ];
            const DAYS = ["S", "M", "T", "W", "T", "F", "S"];
            function shiftMonth(delta) {
                const dates = Object.keys(appData.Calendar || {}).sort();
                const [minY, minM] = dates.length
                    ? dates[0].split("-").map(Number)
                    : [calViewMonth.getFullYear(), calViewMonth.getMonth() + 1];
                const [maxY, maxM] = dates.length
                    ? dates[dates.length - 1].split("-").map(Number)
                    : [calViewMonth.getFullYear(), calViewMonth.getMonth() + 1];
                const next = new Date(
                    calViewMonth.getFullYear(),
                    calViewMonth.getMonth() + delta,
                    1,
                );
                if (
                    next.getFullYear() < minY ||
                    (next.getFullYear() === minY && next.getMonth() + 1 < minM)
                )
                    return;
                if (
                    next.getFullYear() > maxY ||
                    (next.getFullYear() === maxY && next.getMonth() + 1 > maxM)
                )
                    return;
                calViewMonth = next;
                renderCalendar();
            }
            function renderCalendar() {
                if (!appData) return;
                const y = calViewMonth.getFullYear(),
                    mo = calViewMonth.getMonth();
                document.getElementById("cal-month-label").textContent =
                    `${MONTHS[mo]} ${y}`;
                const grid = document.getElementById("cal-grid");
                grid.innerHTML = "";
                DAYS.forEach((d) => {
                    const el = document.createElement("div");
                    el.className = "cal-dow";
                    el.textContent = d;
                    grid.appendChild(el);
                });
                const firstDay = new Date(y, mo, 1).getDay(),
                    daysInMonth = new Date(y, mo + 1, 0).getDate();
                const today = new Date();
                for (let i = 0; i < firstDay; i++) {
                    const el = document.createElement("div");
                    el.className = "cal-day empty";
                    grid.appendChild(el);
                }
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${y}-${String(mo + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
                    const do_ = appData.Calendar
                        ? appData.Calendar[dateStr]
                        : null;
                    const isToday =
                        day === today.getDate() &&
                        mo === today.getMonth() &&
                        y === today.getFullYear();
                    const isWorking = !!do_;
                    const isSelectedOD = odDays.includes(dateStr),
                        isSelectedBunk = bunkDays.includes(dateStr),
                        isCalSel = calSelected.has(dateStr);
                    const el = document.createElement("div");
                    el.className = "cal-day";
                    if (isToday) el.classList.add("today");
                    if (isWorking) el.classList.add("working");
                    else el.classList.add("holiday");
                    if (calMode && isCalSel)
                        el.classList.add(
                            calMode === "od" ? "selected-od" : "selected-bunk",
                        );
                    else if (!calMode && isSelectedOD)
                        el.classList.add("selected-od");
                    else if (!calMode && isSelectedBunk)
                        el.classList.add("selected-bunk");
                    el.innerHTML = `<div class="d-num">${day}</div>${isWorking ? `<div class="d-order">${do_.replace("Day ", "")}</div>` : ""}`;
                    el.onclick = (e) => {
                        e.stopPropagation();
                        if (calMode) {
                            if (calMode === "bunk") {
                                const [yStr, mStr, dStr] = dateStr.split("-");
                                const chosen = new Date(
                                    Number(yStr),
                                    Number(mStr) - 1,
                                    Number(dStr),
                                );
                                if (
                                    chosen <
                                    new Date(
                                        today.getFullYear(),
                                        today.getMonth(),
                                        today.getDate(),
                                    )
                                ) {
                                    showToast("Select a future date to bunk.");
                                    return;
                                }
                            }
                            if (calSelected.has(dateStr))
                                calSelected.delete(dateStr);
                            else if (isWorking) calSelected.add(dateStr);
                            renderCalendar();
                        } else if (isWorking) {
                            jumpCalTarget = do_;
                            goTo(4);
                        }
                    };
                    grid.appendChild(el);
                }
            }

            function renderWeeklyTabs() {
                if (!appData || !appData.Schedule) return;
                const tabs = document.getElementById("wtt-tabs");
                tabs.innerHTML = "";
                ["Day 1", "Day 2", "Day 3", "Day 4", "Day 5"].forEach((day) => {
                    if (!appData.Schedule[day]) return;
                    const t = document.createElement("div");
                    t.className =
                        "wtt-tab" + (day === activeWttDay ? " active" : "");
                    t.textContent = day;
                    t.onclick = () => setWttDay(day);
                    tabs.appendChild(t);
                });
            }
            function setWttDay(day) {
                activeWttDay = day;
                renderWeeklyTabs();
                renderWeeklyDay(day);
                syncClones();
            }
            function renderWeeklyDay(day) {
                if (!appData || !appData.Schedule) return;
                const list = document.getElementById("wtt-list");
                list.innerHTML = "";
                const slots = appData.Schedule[day];
                if (!slots || !Array.isArray(slots)) {
                    const el = document.createElement("div");
                    el.className = "empty-state";
                    el.textContent = "No classes scheduled.";
                    list.appendChild(el);
                    return;
                }
                const CUTOFF_START = 8 * 60,
                    CUTOFF_END = 16 * 60 + 50;
                let hasAny = false,
                    firstStart = null,
                    lastEnd = null;
                if (appData.ActiveCols && Array.isArray(appData.ActiveCols)) {
                    appData.ActiveCols.forEach((i) => {
                        const s = slots[i];
                        if (!s || !s.title) return;
                        const st = parseStartTime(s.time),
                            en = parseEndTime(s.time);
                        if (!st || !en) return;
                        if (timeToMins(en) > CUTOFF_END) return;
                        const sm = timeToMins(st),
                            em = timeToMins(en);
                        if (firstStart === null || sm < firstStart)
                            firstStart = sm;
                        if (lastEnd === null || em > lastEnd) lastEnd = em;
                    });
                    if (firstStart !== null && firstStart - CUTOFF_START > 60) {
                        const freeDiv = document.createElement("div");
                        freeDiv.className = "tt-item is-free";
                        freeDiv.innerHTML = `<div class="tt-time">${minsToTimeStr(CUTOFF_START)}\n${minsToTimeStr(firstStart)}</div><div class="tt-dot"></div><div class="tt-info"><div class="tt-title">No classes</div></div>`;
                        list.appendChild(freeDiv);
                    }
                    appData.ActiveCols.forEach((i) => {
                        const s = slots[i];
                        if (!s || !s.title) return;
                        const end = parseEndTime(s.time);
                        if (end && timeToMins(end) > CUTOFF_END) return;
                        hasAny = true;
                        const div = document.createElement("div");
                        div.className = "tt-item" + (s.isLab ? " is-lab" : "");
                        div.style.setProperty("--i", i + 1);
                        div.innerHTML = `<div class="tt-time">${formatTimeSlot(s.time)}</div><div class="tt-dot"></div><div class="tt-info"><div class="tt-title">${s.title}</div>${s.room ? `<div class="tt-room">${s.room}</div>` : ""}</div>${s.isLab ? '<div class="lab-pill">LAB</div>' : ""}`;
                        list.appendChild(div);
                    });
                }
                if (lastEnd !== null && CUTOFF_END - lastEnd >= 15) {
                    const freeDiv = document.createElement("div");
                    freeDiv.className = "tt-item is-free";
                    freeDiv.innerHTML = `<div class="tt-time">${minsToTimeStr(lastEnd)}\n16:50</div><div class="tt-dot"></div><div class="tt-info"><div class="tt-title">No classes</div></div>`;
                    list.appendChild(freeDiv);
                }
                if (!hasAny) {
                    const el = document.createElement("div");
                    el.className = "empty-state";
                    el.textContent = "No classes scheduled.";
                    list.appendChild(el);
                }
            }

            function showLoading(msg) {
                document.getElementById("load-msg").textContent =
                    msg || "LOADING";
                document.getElementById("loading").classList.remove("hidden");
            }
            function hideLoading() {
                document.getElementById("loading").classList.add("hidden");
            }
            let toastTimer;
            function showToast(msg) {
                const t = document.getElementById("toast");
                t.textContent = msg;
                t.classList.add("show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
            }
            function hideSHint() {
                document.getElementById("swipe-hint").classList.add("gone");
            }
            function promptLogout() {
                if (confirm("Are you sure you want to logout?")) {
                    localStorage.clear();
                    location.reload();
                }
            }

            (async () => {
                buildDots();
                updateODButtons();
                if (appToken) {
                    const cached = localStorage.getItem("yaa_data"),
                        cachedUser = localStorage.getItem("yaa_user");
                    if (cached && cachedUser) {
                        document
                            .getElementById("login-screen")
                            .classList.add("hidden");
                        hideLoading();
                        loadData();
                        return;
                    }
                    document
                        .getElementById("login-screen")
                        .classList.add("hidden");
                    showLoading("CONNECTING");
                    try {
                        const pj = await apiFetch("/profile", {
                            signal: AbortSignal.timeout(10000),
                        });
                        if (pj.ok) {
                            await loadData();
                            return;
                        }
                    } catch (e) {
                        await loadData();
                        return;
                    }
                    hideLoading();
                    showLoginScreen();
                } else {
                    showLoginScreen();
                }
                setTimeout(
                    () =>
                        document
                            .getElementById("swipe-hint")
                            .classList.add("gone"),
                    4000,
                );
            })();
        </script>
    </body>
</html>
