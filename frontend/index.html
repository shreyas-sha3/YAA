<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta
            name="description"
            content="Yet Another lightweight, fast frontend to the SRM Academia portal."
        />
        <title>YetAnotherAcademia</title>
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%25%22 height=%22100%25%22 rx=%2220%22 fill=%22%23000000%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-family=%22Syne, sans-serif%22 font-weight=%22800%22 font-size=%2270%22 fill=%22%23c9a84c%22>Y</text></svg>"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap"
            rel="stylesheet"
        />
        <style>
            /* ── DESIGN TOKENS ─────────────────────────────────────── */
            :root {
                --bg: #000000;
                --surface: #0a0a0a;
                --surface2: #111111;
                --surface3: #1a1a1a;
                --border: #1e1e1e;
                --border2: #262626;
                --text: #f0f0f0;
                --text2: #888888;
                --text3: #3a3a3a;
                --accent: #e8e0d0;
                --gold: #c9a84c;
                --gold2: #7a5f2a;
                --danger: #ff4444;
                --danger-dim: rgba(255, 68, 68, 0.1);
                --ok: #44cc77;
                --ok-dim: rgba(68, 204, 119, 0.08);
                --warn: #ffaa00;
                --warn-dim: rgba(255, 170, 0, 0.1);
                --lab: #2ecc71;
                --lab-dim: rgba(46, 204, 113, 0.1);
                --now-dim: rgba(201, 168, 76, 0.1);
                --r: 10px;
                --r2: 7px;
                --safe-top: env(safe-area-inset-top, 0px);
                --safe-bot: env(safe-area-inset-bottom, 0px);
                --font-body: "Syne", sans-serif;
                --font-mono: "DM Mono", monospace;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                -webkit-tap-highlight-color: transparent;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: var(--bg);
                color: var(--text);
                font-family: var(--font-body);
            }

            /* ── LOGIN ─────────────────────────────────────────────── */
            #login-screen {
                position: fixed;
                inset: 0;
                background: var(--bg);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 100;
                padding: 2rem 2rem calc(var(--safe-bot) + 2rem);
                gap: 1.25rem;
                transition:
                    opacity 0.4s ease,
                    transform 0.4s ease;
            }

            #login-screen.hidden {
                opacity: 0;
                pointer-events: none;
                transform: translateY(-24px);
            }

            .login-logo {
                font-family: var(--font-body);
                font-size: 3rem;
                font-weight: 800;
                letter-spacing: -0.05em;
                color: var(--gold);
                line-height: 1;
                text-align: center;
            }

            .login-subtitle {
                font-family: var(--font-mono);
                font-size: 0.65rem;
                color: var(--text3);
                letter-spacing: 0.14em;
                text-align: center;
                text-transform: uppercase;
            }

            .login-form {
                width: 100%;
                max-width: 340px;
                display: flex;
                flex-direction: column;
                gap: 0.65rem;
                margin-top: 0.5rem;
            }

            .input-wrap {
                position: relative;
            }

            .input-wrap input {
                width: 100%;
                background: var(--surface2);
                border: 1px solid var(--border2);
                border-radius: var(--r2);
                padding: 0.85rem 1rem 0.85rem 2.75rem;
                font-family: var(--font-mono);
                font-size: 0.8rem;
                color: var(--text);
                outline: none;
                transition: border-color 0.2s;
            }

            .input-wrap input:focus {
                border-color: var(--gold2);
            }

            .input-wrap input::placeholder {
                color: var(--text3);
            }

            .input-icon {
                position: absolute;
                left: 0.95rem;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text3);
                font-size: 0.8rem;
                pointer-events: none;
            }

            .view-pw {
                position: absolute;
                right: 0.75rem;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                padding: 0.4rem;
                cursor: pointer;
                color: var(--text3);
                display: flex;
                align-items: center;
                transition: color 0.2s;
            }

            .view-pw:hover,
            .view-pw:active {
                color: var(--gold);
            }

            .view-pw svg {
                fill: none;
                stroke: currentColor;
            }

            .login-btn {
                background: var(--gold);
                color: #000;
                border: none;
                border-radius: var(--r2);
                padding: 0.9rem;
                font-family: var(--font-body);
                font-size: 0.8rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                cursor: pointer;
                transition:
                    opacity 0.2s,
                    transform 0.1s;
                margin-top: 0.25rem;
            }

            .login-btn:active {
                transform: scale(0.98);
                opacity: 0.85;
            }

            .login-error {
                color: var(--danger);
                font-family: var(--font-mono);
                font-size: 0.7rem;
                text-align: center;
                min-height: 1rem;
                letter-spacing: 0.02em;
            }

            .login-suffix {
                font-family: var(--font-mono);
                font-size: 0.65rem;
                color: var(--text3);
                position: absolute;
                right: 0.75rem;
                top: 50%;
                transform: translateY(-50%);
                pointer-events: none;
            }

            .github-link {
                color: var(--text3);
                transition: all 0.2s;
                opacity: 0.5;
                display: flex;
                align-items: center;
                gap: 0.4rem;
                text-decoration: none;
                font-family: var(--font-mono);
                font-size: 0.6rem;
                letter-spacing: 0.06em;
            }

            .github-link:hover {
                color: var(--gold);
                opacity: 1;
                transform: translateY(-1px);
            }

            .github-link svg {
                fill: currentColor;
            }

            /* ── APP SHELL ─────────────────────────────────────────── */
            #app {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                opacity: 0;
                pointer-events: none;
            }

            #app.visible {
                opacity: 1;
                pointer-events: all;
            }

            /* ── HEADER ────────────────────────────────────────────── */
            .app-header {
                padding: calc(var(--safe-top) + 0.7rem) 1.25rem 0.4rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-shrink: 0;
                position: relative;
                z-index: 10;
            }

            .header-name {
                font-family: var(--font-body);
                font-size: 0.8rem;
                font-weight: 600;
                color: var(--text2);
                letter-spacing: 0.02em;
                max-width: 55%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                cursor: pointer;
            }

            .header-right {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .github-link-header {
                color: var(--text3);
                opacity: 0.4;
                display: flex;
                align-items: center;
                text-decoration: none;
                transition: all 0.2s;
            }

            .github-link-header:hover {
                color: var(--gold);
                opacity: 0.8;
            }

            .github-link-header svg {
                fill: currentColor;
            }

            .header-badge {
                font-family: var(--font-mono);
                font-size: 0.6rem;
                background: var(--surface2);
                border: 1px solid var(--border2);
                padding: 0.2rem 0.55rem;
                border-radius: 20px;
                color: var(--text2);
                letter-spacing: 0.06em;
            }

            .header-badge.has-day {
                color: var(--gold);
                border-color: var(--gold2);
            }

            /* ── DOT NAV ───────────────────────────────────────────── */
            .dot-nav {
                display: flex;
                gap: 5px;
                align-items: center;
                justify-content: center;
                padding: 0.2rem 0 0.4rem;
                flex-shrink: 0;
            }

            .dot {
                width: 4px;
                height: 4px;
                border-radius: 50%;
                background: var(--border2);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                cursor: pointer;
            }

            .dot.active {
                background: var(--gold);
                width: 16px;
                border-radius: 3px;
            }

            /* ── SWIPE CONTAINER ───────────────────────────────────── */
            .swipe-wrap {
                flex: 1;
                overflow: hidden;
                position: relative;
                min-height: 0;
            }

            .screens-track {
                display: flex;
                height: 100%;
                transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
                will-change: transform;
            }

            /* ── SCREEN ────────────────────────────────────────────── */
            .screen {
                min-width: 100%;
                height: 100%;
                padding: 0.1rem 1.25rem calc(var(--safe-bot) + 0.75rem);
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                overflow: hidden;
            }

            .screen-label {
                font-family: var(--font-mono);
                font-size: 0.55rem;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: var(--text3);
                flex-shrink: 0;
            }

            .screen-title {
                font-family: var(--font-body);
                font-size: 1.3rem;
                font-weight: 800;
                letter-spacing: -0.03em;
                flex-shrink: 0;
                line-height: 1;
                color: var(--text);
            }

            /* ── INNER SCROLL ──────────────────────────────────────── */
            .inner-scroll {
                flex: 1;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
                scrollbar-width: none;
                min-height: 0;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 0.5rem;
            }

            .inner-scroll::-webkit-scrollbar {
                display: none;
            }

            /* ── TIMETABLE ─────────────────────────────────────────── */
            .tt-list {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 0.45rem;
                overflow-y: auto;
                overflow-x: hidden;
                min-height: 0;
                scrollbar-width: none;
                padding-bottom: 0.5rem;
            }

            .tt-list::-webkit-scrollbar {
                display: none;
            }

            .tt-item {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.75rem 0.9rem;
                border-radius: var(--r);
                border: 1px solid var(--border);
                background: var(--surface);
                position: relative;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                flex-shrink: 0;
            }

            .tt-item.is-now {
                border-color: var(--gold2);
                background: var(--now-dim);
            }

            .tt-item.is-lab {
                border-color: rgba(46, 204, 113, 0.3);
                background: var(--lab-dim);
            }

            .tt-item.is-free {
                border-color: transparent;
                background: transparent;
            }

            .tt-item.is-done {
                opacity: 0.45;
            }

            .tt-time {
                font-family: var(--font-mono);
                font-size: 0.6rem;
                color: var(--text2);
                min-width: 66px;
                line-height: 1.4;
                flex-shrink: 0;
                white-space: pre;
            }

            .tt-dot {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--border2);
                flex-shrink: 0;
                transition: background 0.2s;
            }

            .tt-item.is-now .tt-dot {
                background: var(--gold);
                box-shadow: 0 0 6px var(--gold);
            }

            .tt-item.is-lab .tt-dot {
                background: var(--lab);
            }

            .tt-item.is-free .tt-dot {
                background: var(--text3);
            }

            .tt-info {
                flex: 1;
                min-width: 0;
            }

            .tt-title {
                font-family: var(--font-body);
                font-size: 0.82rem;
                font-weight: 700;
                letter-spacing: -0.01em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                color: var(--text);
            }

            .tt-item.is-free .tt-title {
                color: var(--text3);
                font-weight: 400;
                font-family: var(--font-mono);
                font-size: 0.68rem;
            }

            .tt-room {
                font-family: var(--font-mono);
                font-size: 0.6rem;
                color: var(--text2);
                margin-top: 0.1rem;
            }

            .lab-pill {
                font-family: var(--font-mono);
                font-size: 0.5rem;
                font-weight: 500;
                background: rgba(46, 204, 113, 0.12);
                color: var(--lab);
                border: 1px solid rgba(46, 204, 113, 0.25);
                padding: 0.1rem 0.4rem;
                border-radius: 20px;
                letter-spacing: 0.06em;
                flex-shrink: 0;
            }

            .now-indicator {
                font-family: var(--font-mono);
                font-size: 0.5rem;
                color: var(--gold);
                letter-spacing: 0.1em;
                flex-shrink: 0;
            }

            .progress-bar {
                position: absolute;
                bottom: 0;
                left: 0;
                height: 2px;
                background: var(--gold);
                border-radius: 0 1px 1px 0;
                transition: width 1s linear;
            }

            /* ── ATTENDANCE ────────────────────────────────────────── */
            .att-item {
                padding: 0.65rem 0.85rem;
                border-radius: var(--r);
                border: 1px solid var(--border2);
                background: var(--surface);
                display: flex;
                align-items: center;
                gap: 0.7rem;
                flex-shrink: 0;
            }

            .att-item.is-low {
                border-color: rgba(255, 68, 68, 0.25);
                background: linear-gradient(
                    90deg,
                    var(--danger-dim) 0%,
                    var(--surface) 100%
                );
            }

            .att-pct-ring {
                flex-shrink: 0;
                width: 30px;
                height: 30px;
                position: relative;
            }

            .att-pct-ring svg {
                position: absolute;
                inset: 0;
                transform: rotate(-90deg);
            }

            .ring-bg {
                stroke: var(--border2);
                fill: none;
                stroke-width: 3;
            }

            .ring-fill {
                fill: none;
                stroke-width: 3;
                stroke-linecap: round;
                transition: stroke-dashoffset 0.6s ease;
            }

            .att-pct-text {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--font-mono);
                font-size: 0.55rem;
                font-weight: 600;
            }

            .att-info {
                flex: 1;
                min-width: 0;
            }

            .att-top {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 6px;
            }

            .att-title {
                font-family: var(--font-body);
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: -0.01em;
                line-height: 1.15;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                color: var(--text);
            }

            .att-count {
                font-family: var(--font-mono);
                font-size: 0.6rem;
                color: var(--text2);
                white-space: nowrap;
                flex-shrink: 0;
                margin-top: 1px;
            }

            .att-margin {
                font-family: var(--font-mono);
                font-size: 0.58rem;
                font-weight: 400;
                margin-top: 0.15rem;
                letter-spacing: 0.02em;
                color: var(--text2);
            }

            .att-margin .att-num {
                font-weight: 700;
                font-size: 0.72rem;
            }

            .att-margin.ok .att-num {
                color: #55ee99;
            }

            .att-margin.low .att-num {
                color: #ff5555;
            }

            .att-sep {
                font-family: var(--font-mono);
                font-size: 0.55rem;
                color: var(--text3);
                letter-spacing: 0.18em;
                text-align: center;
                text-transform: uppercase;
                margin: 0.15rem 0;
                flex-shrink: 0;
            }

            /* ── OD/BUNK CONTROLS ──────────────────────────────────── */
            .od-controls {
                display: flex;
                gap: 0.5rem;
                flex-shrink: 0;
            }

            .od-btn {
                flex: 1;
                height: 40px;
                padding: 0 0.4rem;
                border-radius: var(--r);
                font-family: var(--font-body);
                font-size: 0.75rem;
                font-weight: 600;
                letter-spacing: 0.02em;
                border: 1px solid var(--border2);
                background: var(--surface2);
                color: var(--text2);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .od-btn:active {
                transform: scale(0.96);
            }

            .od-btn.active-od {
                border-color: rgba(46, 204, 113, 0.35);
                color: var(--lab);
                background: var(--lab-dim);
            }

            .od-btn.active-bunk {
                border-color: rgba(255, 68, 68, 0.35);
                color: var(--danger);
                background: var(--danger-dim);
            }

            .od-btn.reset {
                flex: 0.55;
                border-color: var(--border);
                color: var(--text3);
                background: var(--surface);
                position: relative;
            }

            .od-btn.reset.has-active::after {
                content: "";
                position: absolute;
                top: 7px;
                right: 7px;
                width: 5px;
                height: 5px;
                background: var(--warn);
                border-radius: 50%;
                box-shadow: 0 0 4px var(--warn);
            }

            /* ── MARKS ─────────────────────────────────────────────── */
            .marks-item {
                padding: 0.75rem 0.9rem;
                border-radius: var(--r);
                border: 1px solid var(--border);
                background: var(--surface);
                flex-shrink: 0;
            }

            .marks-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 0.4rem;
            }

            .marks-course {
                font-family: var(--font-body);
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: -0.01em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 68%;
                color: var(--text);
            }

            .marks-total {
                font-family: var(--font-mono);
                font-size: 0.75rem;
                font-weight: 600;
                color: var(--accent);
            }

            .marks-components {
                display: flex;
                flex-wrap: wrap;
                gap: 0.25rem;
            }

            .comp-chip {
                font-family: var(--font-mono);
                font-size: 0.6rem;
                font-weight: 500;
                padding: 0.2rem 0.5rem;
                border-radius: 20px;
                border: 1px solid var(--border2);
                background: var(--surface3);
                color: var(--text2);
                letter-spacing: 0.02em;
            }

            .comp-chip.low {
                border-color: rgba(255, 68, 68, 0.4);
                color: #ff6666;
                background: var(--danger-dim);
            }

            /* ── CALENDAR ──────────────────────────────────────────── */
            .cal-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-shrink: 0;
            }

            .cal-month {
                font-family: var(--font-body);
                font-size: 1.05rem;
                font-weight: 700;
                letter-spacing: -0.01em;
                color: var(--text);
            }

            .cal-nav {
                display: flex;
                gap: 0.4rem;
            }

            .cal-grid {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 5px;
                flex-shrink: 0;
            }

            .cal-dow {
                font-family: var(--font-mono);
                font-size: 0.55rem;
                color: var(--text3);
                text-align: center;
                padding: 0.2rem 0;
            }

            .cal-day {
                aspect-ratio: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                cursor: pointer;
                position: relative;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                border: 1px solid transparent;
                background: var(--surface2);
            }

            .cal-day:active {
                transform: scale(0.92);
            }

            .cal-day.today {
                border-color: var(--gold2);
                background: var(--now-dim);
            }

            .cal-day.today .d-num {
                color: var(--gold);
                font-weight: 800;
            }

            .cal-day.holiday {
                opacity: 0.3;
                background: transparent;
            }

            .cal-day.selected-od {
                background: var(--lab-dim);
                border-color: rgba(46, 204, 113, 0.5);
            }

            .cal-day.selected-bunk {
                background: var(--danger-dim);
                border-color: rgba(255, 68, 68, 0.5);
            }

            .cal-day.empty {
                pointer-events: none;
                opacity: 0;
            }

            .d-num {
                font-family: var(--font-body);
                font-size: 0.95rem;
                font-weight: 700;
                z-index: 1;
            }

            .d-order {
                font-family: var(--font-mono);
                font-size: 0.5rem;
                position: absolute;
                bottom: 4px;
                color: var(--text2);
                font-weight: 500;
            }

            .cal-mode-label {
                font-family: var(--font-mono);
                font-size: 0.6rem;
                color: var(--text2);
                text-align: center;
                padding: 0.1rem 0;
                flex-shrink: 0;
                letter-spacing: 0.04em;
            }

            .cal-mode-label span {
                color: var(--gold);
            }

            .cal-nav-btn {
                flex: 1;
                height: 40px;
                padding: 0 0.5rem;
                border-radius: var(--r);
                font-family: var(--font-body);
                font-size: 0.75rem;
                font-weight: 600;
                letter-spacing: 0.02em;
                border: 1px solid var(--border2);
                background: var(--surface2);
                color: var(--text2);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s;
            }

            .cal-nav-btn:active {
                transform: scale(0.96);
            }

            .cal-confirm {
                display: flex;
                gap: 0.5rem;
                flex-shrink: 0;
            }

            .confirm-btn {
                flex: 1;
                padding: 0.6rem;
                border-radius: var(--r2);
                font-family: var(--font-body);
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.04em;
                border: none;
                cursor: pointer;
                transition: all 0.2s;
            }

            .confirm-btn:active {
                transform: scale(0.97);
            }

            .confirm-btn.apply {
                background: var(--gold);
                color: #000;
            }

            .confirm-btn.cancel {
                background: var(--surface2);
                color: var(--text2);
                border: 1px solid var(--border2);
            }

            /* ── WEEKLY TABS ───────────────────────────────────────── */
            .wtt-tabs {
                display: flex;
                gap: 0.3rem;
                flex-shrink: 0;
                overflow-x: auto;
                scrollbar-width: none;
            }

            .wtt-tabs::-webkit-scrollbar {
                display: none;
            }

            .wtt-tab {
                flex: 1;
                min-width: 0;
                height: 38px;
                padding: 0;
                border-radius: var(--r);
                font-family: var(--font-body);
                font-size: 0.72rem;
                font-weight: 600;
                letter-spacing: 0.02em;
                border: 1px solid var(--border2);
                background: var(--surface2);
                color: var(--text2);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .wtt-tab:active {
                transform: scale(0.96);
            }

            .wtt-tab.active {
                background: var(--gold);
                color: #000;
                border-color: var(--gold);
                box-shadow: 0 2px 12px rgba(201, 168, 76, 0.2);
            }

            /* ── LOADING ───────────────────────────────────────────── */
            #loading {
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 50;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1rem;
                transition: opacity 0.4s ease;
            }

            #loading.hidden {
                opacity: 0;
                pointer-events: none;
            }

            .load-logo {
                font-family: var(--font-body);
                font-size: 1.5rem;
                font-weight: 800;
                color: var(--gold);
                letter-spacing: -0.02em;
            }

            .load-spinner {
                width: 28px;
                height: 28px;
                border: 2px solid var(--border2);
                border-top-color: var(--gold);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            .load-text {
                font-family: var(--font-mono);
                font-size: 0.65rem;
                color: var(--text3);
                letter-spacing: 0.1em;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* ── TOAST / HINT ──────────────────────────────────────── */
            .swipe-hint {
                position: fixed;
                bottom: calc(var(--safe-bot) + 1rem);
                left: 50%;
                transform: translateX(-50%);
                font-family: var(--font-mono);
                font-size: 0.55rem;
                color: var(--text3);
                letter-spacing: 0.12em;
                pointer-events: none;
                opacity: 1;
                transition: opacity 1s;
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }

            .swipe-hint.gone {
                opacity: 0;
            }

            .toast {
                position: fixed;
                bottom: calc(var(--safe-bot) + 1.5rem);
                left: 50%;
                transform: translateX(-50%) translateY(16px);
                background: var(--surface3);
                border: 1px solid var(--border2);
                border-radius: var(--r2);
                padding: 0.5rem 1rem;
                font-family: var(--font-mono);
                font-size: 0.65rem;
                color: var(--text);
                opacity: 0;
                transition: all 0.3s;
                pointer-events: none;
                white-space: nowrap;
                z-index: 200;
                letter-spacing: 0.04em;
            }

            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            /* ── STALE BANNER ──────────────────────────────────────── */
            .stale-banner {
                background: var(--surface2);
                border: 1px solid var(--warn-dim);
                padding: 0.55rem 0.8rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                border-radius: var(--r2);
                flex-shrink: 0;
            }

            .stale-text {
                font-family: var(--font-mono);
                font-size: 0.58rem;
                color: var(--warn);
                letter-spacing: 0.04em;
            }

            .stale-relogin {
                padding: 0.25rem 0.55rem;
                background: var(--warn-dim);
                color: var(--warn);
                border: 1px solid rgba(255, 170, 0, 0.3);
                border-radius: var(--r2);
                font-family: var(--font-mono);
                font-size: 0.55rem;
                letter-spacing: 0.06em;
                cursor: pointer;
                flex-shrink: 0;
            }

            /* ── EMPTY STATE ───────────────────────────────────────── */
            .empty-state {
                font-family: var(--font-mono);
                font-size: 0.7rem;
                color: var(--text3);
                padding: 0.75rem 0;
                letter-spacing: 0.04em;
            }

            /* ── DESKTOP ARROWS ────────────────────────────────────── */
            .desk-arrow {
                display: none;
                position: fixed;
                top: 50%;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: var(--surface2);
                border: 1px solid var(--border2);
                color: var(--text3);
                cursor: pointer;
                z-index: 20;
                align-items: center;
                justify-content: center;
                font-size: 1rem;
                transition: all 0.2s;
                transform: translateY(-50%);
                user-select: none;
            }

            .desk-arrow:hover {
                background: var(--surface3);
                border-color: var(--gold2);
                color: var(--gold);
            }

            .desk-arrow:active {
                transform: translateY(-50%) scale(0.9);
            }

            #arr-left {
                left: 0.75rem;
            }

            #arr-right {
                right: 0.75rem;
            }

            /* ── ENTER ANIMATION ───────────────────────────────────── */
            @keyframes fadeUp {
                from {
                    opacity: 0;
                    translate: 0 10px;
                }

                to {
                    opacity: 1;
                    translate: 0 0;
                }
            }

            .screen.entering .tt-item,
            .screen.entering .att-item,
            .screen.entering .marks-item,
            .screen.entering .cal-grid,
            .screen.entering .wtt-tab {
                animation: fadeUp 0.3s ease both;
                animation-delay: calc(var(--i, 0) * 0.035s);
            }

            /* ── COMPACT (small phones) ────────────────────────────── */
            @media (max-height: 720px) {
                .app-header {
                    padding-top: calc(var(--safe-top) + 0.45rem);
                    padding-bottom: 0.25rem;
                }

                .dot-nav {
                    padding: 0.1rem 0 0.25rem;
                }

                .screen {
                    gap: 0.35rem;
                    padding-top: 0;
                }

                .screen-title {
                    font-size: 1.1rem;
                }

                .att-item {
                    padding: 0.5rem 0.75rem;
                }

                .tt-item {
                    padding: 0.55rem 0.75rem;
                }

                .marks-item {
                    padding: 0.6rem 0.75rem;
                }

                .cal-grid {
                    gap: 4px;
                }

                .od-btn,
                .cal-nav-btn,
                .wtt-tab {
                    height: 36px;
                }

                .d-num {
                    font-size: 0.85rem;
                }
            }

            /* ── DESKTOP ───────────────────────────────────────────── */
            @media (min-width: 768px) {
                .swipe-wrap {
                    overflow: visible;
                }

                .screens-track {
                    gap: 20px;
                }

                .screen {
                    --card-w: 420px;
                    min-width: var(--card-w);
                    max-width: var(--card-w);
                    height: 85vh;
                    max-height: 850px;
                    margin: auto 0;
                    padding: 0.75rem 1.25rem 1rem;
                    border-radius: 20px;
                    border: 1px solid var(--border);
                    background: var(--surface);
                    flex-shrink: 0;
                    opacity: 0;
                    transform: scale(0.88) translateY(6px);
                    filter: blur(2px);
                    pointer-events: none;
                    transition:
                        opacity 0.4s,
                        transform 0.4s,
                        filter 0.4s;
                    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
                }

                .screen.desk-active {
                    opacity: 1;
                    transform: scale(1);
                    filter: none;
                    pointer-events: all;
                    border-color: var(--border2);
                }

                .screen.desk-near {
                    opacity: 0.45;
                    transform: scale(0.95) translateY(3px);
                    filter: blur(0.5px);
                    pointer-events: all;
                    cursor: pointer;
                }

                .screen.desk-near:hover {
                    opacity: 0.6;
                    transform: scale(0.96) translateY(2px);
                }

                .screen.desk-far {
                    opacity: 0.12;
                    transform: scale(0.91) translateY(5px);
                    filter: blur(1.5px);
                    pointer-events: none;
                }

                .desk-arrow {
                    display: flex;
                }

                .dot {
                    width: 6px;
                    height: 6px;
                }

                .dot.active {
                    width: 22px;
                }

                #swipe-hint {
                    display: none;
                }
            }

            .instant-snap .screen {
                transition: none !important;
            }
        </style>
    </head>

    <body>

        <script>
            // const API = "https://yaa-k29h.onrender.com/api";
            const API = "http://localhost:5000/api";
            const SCREENS = 5;
            let appToken = localStorage.getItem("academia_token") || "";
            let loginSessionToken = null;
            let appData = null;
            let curScreen = 0;
            let calMode = null;
            let calSelected = new Set();
            let odDays = JSON.parse(localStorage.getItem("od_days") || "[]");
            let bunkDays = JSON.parse(
                localStorage.getItem("bunk_days") || "[]",
            );
            let calViewMonth = new Date();
            let activeWttDay = "Day 1";
            let jumpCalTarget = null;
            const track = document.getElementById("track");
            const wrap = document.getElementById("swipe-wrap");
            let touchX = 0,
                touchY = 0,
                isDragging = false,
                dragDelta = 0;
            const IS_DESKTOP = () => window.innerWidth >= 768;
            const CARD_W = 420,
                CARD_GAP = 20;
            const origScreens = [...track.children];
            const cloneFirst = origScreens[0].cloneNode(true);
            const cloneLast = origScreens[SCREENS - 1].cloneNode(true);
            cloneFirst.classList.add("clone");
            cloneLast.classList.add("clone");
            cloneFirst
                .querySelectorAll("[id]")
                .forEach((el) => el.removeAttribute("id"));
            cloneLast
                .querySelectorAll("[id]")
                .forEach((el) => el.removeAttribute("id"));
            track.appendChild(cloneFirst);
            track.insertBefore(cloneLast, origScreens[0]);
            let domIndex = 1;
            const getRealScreens = () =>
                [...track.children].slice(1, SCREENS + 1);

            wrap.addEventListener(
                "touchstart",
                (e) => {
                    if (IS_DESKTOP()) return;
                    touchX = e.touches[0].clientX;
                    touchY = e.touches[0].clientY;
                    isDragging = true;
                    dragDelta = 0;
                    track.style.transition = "none";
                },
                { passive: true },
            );
            wrap.addEventListener(
                "touchmove",
                (e) => {
                    if (!isDragging || IS_DESKTOP()) return;
                    const dx = e.touches[0].clientX - touchX;
                    const dy = e.touches[0].clientY - touchY;
                    if (Math.abs(dy) > Math.abs(dx) + 10) {
                        isDragging = false;
                        return;
                    }
                    dragDelta = dx;
                    track.style.transform = `translateX(calc(${-domIndex * 100}vw + ${dx}px))`;
                },
                { passive: true },
            );
            wrap.addEventListener("touchend", () => {
                if (!isDragging || IS_DESKTOP()) return;
                isDragging = false;
                track.style.transition = "";
                const thr = wrap.clientWidth * 0.22;
                if (dragDelta < -thr) doNav(domIndex + 1);
                else if (dragDelta > thr) doNav(domIndex - 1);
                else doNav(domIndex);
            });

            let wheelCD = false;
            wrap.addEventListener(
                "wheel",
                (e) => {
                    if (!IS_DESKTOP()) return;
                    e.preventDefault();
                    if (wheelCD) return;
                    wheelCD = true;
                    setTimeout(() => (wheelCD = false), 500);
                    const d = e.deltaX || e.deltaY;
                    if (d > 25) doNav(domIndex + 1);
                    else if (d < -25) doNav(domIndex - 1);
                },
                { passive: false },
            );

            document.addEventListener("keydown", (e) => {
                if (
                    !document
                        .getElementById("login-screen")
                        .classList.contains("hidden")
                )
                    return;
                if (e.key === "ArrowRight") {
                    e.preventDefault();
                    doNav(domIndex + 1);
                }
                if (e.key === "ArrowLeft") {
                    e.preventDefault();
                    doNav(domIndex - 1);
                }
            });
            getRealScreens().forEach((s, i) => {
                s.addEventListener("click", (e) => {
                    if (
                        e.target.closest(
                            ".od-btn,.cal-day,.cal-nav-btn,.confirm-btn,.wtt-tab,a,button",
                        )
                    )
                        return;
                    if (IS_DESKTOP() && i !== curScreen) doNav(i + 1);
                });
            });

            let snapTimer = null;
            function doNav(tdi) {
                if (snapTimer) {
                    clearTimeout(snapTimer);
                    snapTimer = null;
                }
                if (tdi > SCREENS + 1) {
                    goToCore(1, true);
                    tdi = 2;
                } else if (tdi < 0) {
                    goToCore(SCREENS, true);
                    tdi = SCREENS - 1;
                }
                goToCore(tdi, false);
                const sd = IS_DESKTOP() ? 460 : 360;
                if (tdi === 0)
                    snapTimer = setTimeout(() => {
                        goToCore(SCREENS, true);
                        snapTimer = null;
                    }, sd);
                else if (tdi === SCREENS + 1)
                    snapTimer = setTimeout(() => {
                        goToCore(1, true);
                        snapTimer = null;
                    }, sd);
            }
            function goTo(idx) {
                doNav(idx + 1);
            }

            function applyTransform(instant) {
                const els = [...track.children];
                if (instant) track.classList.add("instant-snap");
                if (!IS_DESKTOP()) {
                    track.style.transition = instant
                        ? "none"
                        : "transform .35s ease";
                    track.style.transform = `translateX(${-domIndex * 100}vw)`;
                    track.style.gap = "";
                    els.forEach(
                        (s) =>
                            (s.className = s.className
                                .replace(
                                    /(desk-active|desk-near|desk-far)/g,
                                    "",
                                )
                                .trim()),
                    );
                } else {
                    const viewW = wrap.clientWidth;
                    const offset =
                        viewW / 2 - CARD_W / 2 - domIndex * (CARD_W + CARD_GAP);
                    track.style.transition = instant
                        ? "none"
                        : "transform .45s cubic-bezier(.4,0,.2,1)";
                    track.style.transform = `translateX(${offset}px)`;
                    track.style.gap = CARD_GAP + "px";
                    els.forEach((s, idx) => {
                        s.classList.remove(
                            "desk-active",
                            "desk-near",
                            "desk-far",
                        );
                        const d = Math.abs(idx - domIndex);
                        if (d === 0) s.classList.add("desk-active");
                        else if (
                            d === 1 ||
                            (idx === SCREENS + 1 && domIndex === 1) ||
                            (idx === 0 && domIndex === SCREENS)
                        )
                            s.classList.add("desk-near");
                        else s.classList.add("desk-far");
                    });
                }
                if (instant) {
                    void track.offsetWidth;
                    track.classList.remove("instant-snap");
                }
            }
            window.addEventListener("resize", () => applyTransform(true));

            function goToCore(idx, instant) {
                const prev = curScreen;
                domIndex = idx;
                if (domIndex === 0) curScreen = SCREENS - 1;
                else if (domIndex === SCREENS + 1) curScreen = 0;
                else curScreen = domIndex - 1;
                applyTransform(instant);
                updateDots();
                if (curScreen !== prev && !instant) triggerEnterAnim(domIndex);
                hideSHint();
                syncClones();
                if (curScreen === 4 && jumpCalTarget) {
                    setWttDay(jumpCalTarget);
                    jumpCalTarget = null;
                }
                if (curScreen !== 3 && calMode) {
                    calMode = null;
                    calSelected.clear();
                    renderCalConfirm();
                    updateCalModeLabel();
                }
            }
            function syncClones() {
                const te = [...track.children];
                const s1 = te[1],
                    s5 = te[5],
                    cL = te[0],
                    cF = te[6];
                if (s1 && cF) {
                    cF.innerHTML = s1.innerHTML;
                    cF.querySelectorAll("[id]").forEach((el) =>
                        el.removeAttribute("id"),
                    );
                }
                if (s5 && cL) {
                    cL.innerHTML = s5.innerHTML;
                    cL.querySelectorAll("[id]").forEach((el) =>
                        el.removeAttribute("id"),
                    );
                }
            }
            function triggerEnterAnim(idx) {
                const s = [...track.children][idx];
                if (!s) return;
                s.classList.remove("entering");
                void s.offsetWidth;
                s.classList.add("entering");
                setTimeout(() => s.classList.remove("entering"), 600);
            }
            function buildDots() {
                const nav = document.getElementById("dot-nav");
                nav.innerHTML = "";
                for (let i = 0; i < SCREENS; i++) {
                    const d = document.createElement("div");
                    d.className = "dot" + (i === curScreen ? " active" : "");
                    d.onclick = () => goTo(i);
                    nav.appendChild(d);
                }
            }
            function updateDots() {
                document
                    .querySelectorAll(".dot")
                    .forEach(
                        (d, i) =>
                            (d.className =
                                "dot" + (i === curScreen ? " active" : "")),
                    );
            }

            async function apiFetch(path, options = {}) {
                const url = path.startsWith("http") ? path : `${API}${path}`;
                options.headers = options.headers || {};
                if (appToken) options.headers["X-Session-Token"] = appToken;
                try {
                    let r = await fetch(url, options);
                    let d = await r
                        .clone()
                        .json()
                        .catch(() => ({}));
                    if (
                        (r.status === 401 || d.error === "SESSION_EXPIRED") &&
                        !url.includes("/login")
                    ) {
                        if (appData) {
                            appData.syncFailed = true;
                            renderAttendance();
                            renderMarks();
                            showToast("Session expired. Please log in again.");
                        }
                        showLoginScreen();
                        return d;
                    }
                    if (d.ok && appData) appData.syncFailed = false;
                    return d;
                } catch (e) {
                    console.error("API Fetch Error:", e);
                    throw e;
                }
            }

            async function showLoginScreen() {
                document
                    .getElementById("login-screen")
                    .classList.remove("hidden");
                document.getElementById("app").classList.remove("visible");
                const err = document.getElementById("login-err");
                err.textContent = "Loading security check...";
                try {
                    const resp = await fetch(`${API}/login/init`);
                    const data = await resp.json();
                    if (data.ok && data.session_token && data.captcha_image) {
                        loginSessionToken = data.session_token;
                        document.getElementById("captcha-img").src =
                            data.captcha_image;
                        document.getElementById(
                            "captcha-container",
                        ).style.display = "flex";
                        document.getElementById("inp-captcha").value = "";
                        err.textContent = "";
                    } else {
                        err.textContent = "Failed to initialize login.";
                    }
                } catch (e) {
                    err.textContent = "Network error connecting to backend.";
                }
            }

            async function doLogin() {
                const id = document.getElementById("inp-id").value.trim();
                const pwSp = document.getElementById("inp-pw-sp").value;
                const pwAcad = document.getElementById("inp-pw-acad").value;
                const cap = document.getElementById("inp-captcha").value.trim();
                const err = document.getElementById("login-err");
                if (!id || !pwSp || !pwAcad || !cap) {
                    err.textContent = "Enter all credentials and captcha.";
                    return;
                }
                if (!loginSessionToken) {
                    err.textContent =
                        "Security handshake pending. Please refresh.";
                    return;
                }
                err.textContent = "";
                showLoading("AUTHENTICATING");
                try {
                    const d = await apiFetch("/login/complete", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            username: id,
                            sp_password: pwSp,
                            acad_password: pwAcad,
                            captcha: cap,
                            session_token: loginSessionToken,
                        }),
                    });
                    if (d.ok) {
                        appToken = d.session_token || d.token;
                        if (appToken)
                            localStorage.setItem("academia_token", appToken);
                        if (d.creds)
                            localStorage.setItem("academia_creds", d.creds);
                        document
                            .getElementById("login-screen")
                            .classList.add("hidden");
                        await loadData();
                    } else {
                        hideLoading();
                        err.textContent = d.error || "Login failed.";
                        document.getElementById("inp-captcha").value = "";
                        showLoginScreen();
                    }
                } catch (e) {
                    hideLoading();
                    err.textContent = "Connection error.";
                }
            }

            async function loadData() {
                const cached = localStorage.getItem("yaa_data");
                let isValidCache = false;
                if (cached) {
                    try {
                        appData = JSON.parse(cached);
                        if (
                            !appData ||
                            !appData.Schedule ||
                            !appData.Attendance
                        )
                            throw new Error("Corrupted cache");
                        populateUIFromData();
                        document.getElementById("app").classList.add("visible");
                        document
                            .getElementById("login-screen")
                            .classList.add("hidden");
                        hideLoading();
                        syncDataInBackground();
                        isValidCache = true;
                    } catch (e) {
                        console.warn("Cleared corrupted cache.");
                        localStorage.removeItem("yaa_data");
                    }
                }
                if (!isValidCache) {
                    showLoading("FETCHING DATA");
                    try {
                        const [prof, data] = await Promise.all([
                            apiFetch("/profile"),
                            apiFetch("/data"),
                        ]);
                        if (!prof.ok || !data.ok) {
                            hideLoading();
                            if (!prof.ok) showLoginScreen();
                            return;
                        }
                        appData = data;
                        localStorage.setItem(
                            "yaa_data",
                            JSON.stringify(appData),
                        );
                        document.getElementById("hdr-name").textContent =
                            prof.name.split(" ")[0] || prof.name;
                        localStorage.setItem(
                            "yaa_user",
                            document.getElementById("hdr-name").textContent,
                        );
                        populateUIFromData();
                        hideLoading();
                        document.getElementById("app").classList.add("visible");
                        document
                            .getElementById("login-screen")
                            .classList.add("hidden");
                        setInterval(renderToday, 60000);
                    } catch (e) {
                        hideLoading();
                        showLoginScreen();
                    }
                }
            }

            function populateUIFromData() {
                const today = new Date();
                const y = today.getFullYear(),
                    m = String(today.getMonth() + 1).padStart(2, "0"),
                    d = String(today.getDate()).padStart(2, "0");
                const todayStr = `${y}-${m}-${d}`;
                let isHoliday = false;
                let dayKey = appData.Calendar
                    ? appData.Calendar[todayStr]
                    : appData.DayOrder;
                if (!dayKey && appData.Calendar) {
                    isHoliday = true;
                    let dates = Object.keys(appData.Calendar).sort();
                    let nextDate = dates.find((dt) => dt > todayStr);
                    if (nextDate) dayKey = appData.Calendar[nextDate];
                }
                appData.effectiveDayKey = dayKey;
                appData.isHolidayToday = isHoliday;
                const hdrDay = document.getElementById("hdr-day");
                if (isHoliday) {
                    hdrDay.textContent = dayKey ? `Next: ${dayKey}` : "Holiday";
                    hdrDay.className = "header-badge";
                } else {
                    hdrDay.textContent = dayKey || "Holiday";
                    hdrDay.className =
                        "header-badge" + (dayKey ? " has-day" : "");
                }
                const name = localStorage.getItem("yaa_user");
                if (name)
                    document.getElementById("hdr-name").textContent = name;
                buildDots();
                goToCore(domIndex, true);
                renderToday();
                renderAttendance();
                renderMarks();
                renderCalendar();
                renderWeeklyTabs();
                renderWeeklyDay("Day 1");
                syncClones();
            }

            async function syncDataInBackground() {
                const nameEl = document.getElementById("hdr-name");
                const orig = nameEl.textContent;
                nameEl.innerHTML =
                    orig +
                    ' <span style="font-size:0.5rem;color:var(--gold);animation:spin 1s linear infinite;display:inline-block;">&#8635;</span>';
                try {
                    const d = await apiFetch(`/data?sync=true`, {
                        signal: AbortSignal.timeout(15000),
                    });
                    if (d.ok) {
                        if (
                            (!d.Attendance || d.Attendance.length === 0) &&
                            (!d.Marks || d.Marks.length === 0) &&
                            appData.Attendance &&
                            appData.Attendance.length > 0
                        ) {
                            appData.syncFailed = true;
                        } else {
                            appData.Attendance = d.Attendance;
                            appData.Marks = d.Marks;
                            appData.syncFailed = false;
                            localStorage.setItem(
                                "yaa_data",
                                JSON.stringify(appData),
                            );
                        }
                        renderAttendance();
                        renderMarks();
                        renderToday();
                    }
                } catch (e) {
                    console.warn("Background sync failed", e);
                }
                const name = localStorage.getItem("yaa_user");
                if (name) nameEl.textContent = name;
            }

            function togglePW(inputId, btnId) {
                const p = document.getElementById(inputId),
                    b = document.getElementById(btnId);
                if (p.type === "password") {
                    p.type = "text";
                    b.innerHTML =

                } else {
                    p.type = "password";
                    b.innerHTML =
                        '<svg width="15" height="15" viewBox="0 0 24 24" stroke-width="2" fill="none" stroke="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
                }
            }
            function parseEndTime(ts) {
                const m = ts.match(/\d{1,2}:\d{2}\s*-\s*(\d{1,2}):(\d{2})/);
                if (!m) return null;
                let h = +m[1];
                if (h < 8) h += 12;
                return { h, min: +m[2] };
            }
            function parseStartTime(ts) {
                const m = ts.match(/(\d{1,2}):(\d{2})\s*-/);
                if (!m) return null;
                let h = +m[1];
                if (h < 8) h += 12;
                return { h, min: +m[2] };
            }
            function timeToMins(t) {
                return t ? t.h * 60 + t.min : 0;
            }

            function renderToday() {
                if (!appData) return;
                const d = appData,
                    dayKey = d.effectiveDayKey,
                    isHoliday = d.isHolidayToday;
                const list = document.getElementById("tt-list"),
                    title = document.getElementById("s1-title");
                title.textContent = isHoliday
                    ? dayKey
                        ? `Holiday \u2014 Next: ${dayKey}`
                        : "Holiday"
                    : dayKey
                      ? dayKey
                      : "Holiday";
                const now = new Date(),
                    nowMins = isHoliday
                        ? -1
                        : now.getHours() * 60 + now.getMinutes();
                const CUTOFF_START = 8 * 60;
                let maxClassEnd = 0,
                    items = [];
                if (dayKey && d.Schedule[dayKey]) {
                    for (let i = 0; i < d.Schedule[dayKey].length; i++) {
                        const slot = d.Schedule[dayKey][i];
                        if (!slot || !slot.title || !slot.time) continue;
                        const end = parseEndTime(slot.time),
                            start = parseStartTime(slot.time);
                        if (!end || !start) continue;
                        const endM = timeToMins(end),
                            startM = timeToMins(start);
                        if (startM < CUTOFF_START) continue;
                        if (endM > maxClassEnd) maxClassEnd = endM;
                        items.push({ ...slot, startM, endM });
                    }
                }
                items.sort((a, b) => a.startM - b.startM);
                let full = [],
                    cur = CUTOFF_START;
                for (const m of items) {
                    if (m.startM - cur >= 15)
                        full.push({
                            free: true,
                            startM: cur,
                            endM: m.startM,
                            time: `${minsToTimeStr(cur)} - ${minsToTimeStr(m.startM)}`,
                        });
                    full.push(m);
                    cur = m.endM;
                }
                const DAY_END = 16 * 60 + 50;
                if (DAY_END - cur >= 15)
                    full.push({
                        free: true,
                        startM: cur,
                        endM: DAY_END,
                        time: `${minsToTimeStr(cur)} - 16:50`,
                    });
                if (full.length === 0)
                    full.push({
                        free: true,
                        startM: CUTOFF_START,
                        endM: DAY_END,
                        time: "8:00 - 16:50",
                    });
                list.innerHTML = "";
                full.forEach((item) => {
                    const div = document.createElement("div");
                    div.className = "tt-item";
                    div.style.setProperty("--i", full.indexOf(item) + 1);
                    const isNow =
                        !item.free &&
                        nowMins >= item.startM &&
                        nowMins < item.endM;
                    const isDone = !item.free && nowMins >= item.endM;
                    if (item.free) div.classList.add("is-free");
                    else if (isNow) div.classList.add("is-now");
                    else if (item.isLab) div.classList.add("is-lab");
                    if (isDone) div.classList.add("is-done");
                    let progressHtml = "";
                    if (isNow && !item.free) {
                        const dur = item.endM - item.startM,
                            elapsed = nowMins - item.startM;
                        const pct = Math.min(100, (elapsed / dur) * 100);
                        progressHtml = `<div class="progress-bar" style="width:${pct}%"></div>`;
                    }
                    div.innerHTML = `
                        <div class="tt-time">${formatTimeSlot(item.time)}</div>
                        <div class="tt-dot"></div>
                        <div class="tt-info">
                            <div class="tt-title">${item.free ? "No classes" : item.title || "\u2014"}</div>
                            ${!item.free && item.room ? `<div class="tt-room">${item.room}</div>` : ""}
                        </div>
                        ${item.isLab && !item.free ? '<div class="lab-pill">LAB</div>' : ""}
                        ${isNow ? '<div class="now-indicator">NOW</div>' : ""}
                        ${progressHtml}
                    `;
                    list.appendChild(div);
                });
                syncClones();
            }

            function minsToTimeStr(m) {
                const h = Math.floor(m / 60),
                    min = m % 60;
                return `${h}:${String(min).padStart(2, "0")}`;
            }
            function formatTimeSlot(ts) {
                return ts
                    .replace(/\s*(AM|PM)\s*/gi, "")
                    .trim()
                    .replace(" - ", "\n");
            }

            function calcAttendance(raw) {
                if (!appData || !raw || !Array.isArray(raw)) return [];
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
                return raw.map((a) => {
                    let conducted = parseInt(a.Conducted) || 0,
                        attended = parseInt(a.Attended) || 0;
                    const isPractical =
                        typeof a.Category === "string" &&
                        a.Category.toLowerCase().includes("practical");
                    const aTitleClean = a.Title.toLowerCase().replace(
                        /[^a-z0-9]/g,
                        "",
                    );
                    const processedDays = new Set();
                    const processDay = (dateStr, type) => {
                        const do_ = appData.Calendar
                            ? appData.Calendar[dateStr]
                            : null;
                        if (!do_ || !appData.Schedule[do_]) return;
                        appData.ActiveCols.forEach((i) => {
                            const slot = appData.Schedule[do_][i];
                            if (!slot || !slot.title) return;
                            const sTitleClean = slot.title
                                .toLowerCase()
                                .replace(/[^a-z0-9]/g, "");
                            let isFutureSlot = dateStr > todayStr;
                            if (dateStr === todayStr && slot.time) {
                                const m = slot.time.match(
                                    /(\d{1,2}):(\d{2})\s*-/,
                                );
                                if (m) {
                                    let h = +m[1];
                                    if (h < 8) h += 12;
                                    const startMins = h * 60 + +m[2];
                                    const nowMins =
                                        today.getHours() * 60 +
                                        today.getMinutes();
                                    if (startMins > nowMins)
                                        isFutureSlot = true;
                                }
                            }
                            if (
                                (sTitleClean.includes(aTitleClean) ||
                                    aTitleClean.includes(sTitleClean)) &&
                                !!slot.isLab === isPractical
                            ) {
                                if (isFutureSlot) {
                                    conducted++;
                                    if (type === "od" || type === "attend")
                                        attended++;
                                } else {
                                    if (type === "bunk") {
                                        if (attended > 0) attended--;
                                    } else if (type === "od") {
                                        if (attended < conducted) attended++;
                                    }
                                }
                            }
                        });
                    };
                    if (bunkDays.length > 0) {
                        const maxBunk = bunkDays.reduce((a, b) =>
                            a > b ? a : b,
                        );
                        const allDates = Object.keys(
                            appData.Calendar || {},
                        ).sort();
                        const range = allDates.filter(
                            (d) => d >= todayStr && d <= maxBunk,
                        );
                        range.forEach((d) => {
                            processDay(
                                d,
                                bunkDays.includes(d) ? "bunk" : "attend",
                            );
                            processedDays.add(d);
                        });
                    }
                    odDays.forEach((d) => {
                        if (!processedDays.has(d)) {
                            processDay(d, "od");
                            processedDays.add(d);
                        }
                    });
                    bunkDays.forEach((d) => {
                        if (!processedDays.has(d)) processDay(d, "bunk");
                    });
                    const pct =
                        conducted > 0 ? (attended / conducted) * 100 : 0;
                    const isLow = pct < 75;
                    let marginText = "";
                    if (isLow) {
                        const needed = Math.ceil(
                            (0.75 * conducted - attended) / 0.25,
                        );
                        marginText = `<span class="att-num">${needed}</span> Required`;
                    } else {
                        const canBunk = Math.floor(
                            (attended - 0.75 * conducted) / 0.75,
                        );
                        marginText = `<span class="att-num">${Math.max(0, canBunk)}</span> Margin`;
                    }
                    return {
                        ...a,
                        pct,
                        isLow,
                        marginText,
                        effConducted: conducted,
                        effAttended: attended,
                    };
                });
            }

            function renderAttendance() {

                    list.appendChild(bn);

                const theory = processed.filter(
                    (a) =>
                        typeof a.Category !== "string" ||

                const practical = processed.filter(

                let idx = 1;
